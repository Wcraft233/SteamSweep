[package]
name = "steamsweep"
version = "0.1.1"
edition = "2021"
description = "SteamSweep — Steam 残留清理二合一：已卸载游戏安装残留清理 + 存档管理/清理（GUI+CLI）"

[dependencies]
eframe = "0.31"
egui_extras = "0.31"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
ureq = { version = "2", default-features = false, features = ["native-tls"] }
trash = "5"
native-tls = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
walkdir = "2"
winreg = "0.52"
chrono = "0.4"
jwalk = "0.9.0"

[build-dependencies]

[profile.release]
opt-level = 2
