name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build (release, static CRT)
        run: cargo build --release --locked
        env:
          # 静态链接 CRT，分发 exe 不依赖目标机的 VC++ 运行库
          RUSTFLAGS: -C target-feature=+crt-static

      - name: 上传 exe 构件
        uses: actions/upload-artifact@v4
        with:
          name: steamsweep-windows-x86_64
          path: target/release/steamsweep.exe
          retention-days: 30

  release:
    # main 每次推送 → 滚动「最新构建」prerelease；打 v* 标签 → 正式 Release
    if: github.event_name == 'push'
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: steamsweep-windows-x86_64

      - name: 滚动 prerelease（main 分支）
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: 最新构建（滚动更新）
          body: main 分支每次推送自动更新的构建，想尝鲜用这个；稳定版看正式 Release。
          prerelease: true
          files: steamsweep.exe

      - name: 正式 Release（v* 标签）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: steamsweep.exe
          generate_release_notes: true
